    <title>Time tracking dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>

  <body
    class="min-h-screen bg-navy-950 md:flex md:justify-center md:items-center"
  >
    <div
      class="w-[87.2%] md:w-[79.6875%] xl:w-[77.5%] xl:max-w-279 mx-auto my-20 grid grid-cols-1 gap-6 md:place-items-center xl:grid-cols-[16rem_auto]"
    >
      <header class="w-full h-full bg-navy-900 rounded-[15px] overflow-hidden">
        <nav
          class="p-8 flex items-center gap-6 justify-center bg-purple-600 rounded-[15px] md:justify-start xl:flex-col xl:items-start xl:gap-10"
        >
          <div class="w-16 xl:w-19.5 ring-3 ring-white rounded-full">
            <img
              src="images/image-jeremy.png"
              alt="Photo of the Jeremy Robson"
            />
          </div>
          <div>
            <p class="preset-6 text-navy-200 mb-2">Report for</p>
            <p class="preset-4 text-white xl:preset-2">Jeremy Robson</p>
          </div>
        </nav>
        <main
          class="range w-full py-6 flex items-center justify-evenly md:w-[56%] md:mx-auto md:gap-2 xl:flex-col xl:items-start xl:mx-8 xl:mb-8 xl:mt-7 xl:gap-5"
        >
          <p
            class="day range-option preset-5-regular text-purple-500 cursor-pointer md:w-1/3 md:text-center xl:text-left"
            data-value="daily"
          >
            Daily
          </p>
          <p
            class="week range-option preset-5-regular active-category cursor-pointer md:w-1/3 md:text-center xl:text-left"
            data-value="weekly"
          >
            Weekly
          </p>
          <p
            class="month range-option preset-5-regular text-purple-500 cursor-pointer md:w-1/3 md:text-center xl:text-left"
            data-value="monthly"
          >
            Monthly
          </p>
        </main>
      </header>

      <main
        class="main-content w-full h-full grid grid-cols-1 gap-6 md:grid-cols-3 xl:gap-8"
